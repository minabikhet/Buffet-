<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c3e50">
    <title>Admin Panel </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .orders-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .orders-header h2 {
            color: #333;
            font-size: 22px;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }

        .orders-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .orders-table th {
            padding: 15px;
            text-align: right;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .orders-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        .orders-table tbody tr:hover {
            background: #f8f9fa;
        }

        .order-items {
            font-size: 13px;
            color: #666;
        }

        .order-item {
            margin-bottom: 3px;
        }

        .no-orders {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        @media (max-width: 1024px) {
            .container {
                padding: 15px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 10px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .btn-export {
                width: 100%;
                padding: 12px 20px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card h3 {
                font-size: 14px;
            }

            .stat-card .number {
                font-size: 28px;
            }

            .orders-table {
                font-size: 12px;
                display: block;
                overflow-x: auto;
            }

            .orders-table thead {
                display: none;
            }

            .orders-table tr {
                display: block;
                margin-bottom: 15px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                padding: 10px;
            }

            .orders-table td {
                display: block;
                text-align: right;
                padding: 5px;
                border: none;
            }

            .orders-table td::before {
                content: attr(data-label);
                font-weight: bold;
                margin-left: 10px;
            }

            .empty-state h3 {
                font-size: 20px;
            }

            .empty-state p {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .stat-card h3 {
                font-size: 13px;
            }

            .stat-card .number {
                font-size: 24px;
            }

            .orders-table {
                font-size: 11px;
            }
        }

        /* Better touch targets */
        @media (hover: none) {
            .btn-export {
                min-height: 44px;
            }
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
    <div class="header">
        <div>
            <div
                style="font-size: 36px; font-weight: bold; color: #000; letter-spacing: 3px; font-family: 'GeoHeavymetric 231  BT','Geometr231 Hv BT', Arial, sans-serif; line-height: 1;">
                MARMONIL</div>
            <div style="font-size: 16px; color: #666; font-weight: 500; letter-spacing: 2px; margin-top: 3px;">Buffet
            </div>
            <h1 style="margin-top: 10px;">📊 Admin Panel</h1>
            <p style="color: #666; margin-top: 5px;">Welcome to the Buffet Management System</p>
        </div>
        <div class="header-buttons">
            <button class="btn btn-primary" onclick="exportToExcel()">📥 Export to Excel</button>
            <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Orders</h3>
            <div class="number" id="totalOrders">0</div>
        </div>
        <div class="stat-card">
            <h3>Active Employees</h3>
            <div class="number" id="activeEmployees">0</div>
        </div>
        <div class="stat-card">
            <h3>Today Orders</h3>
            <div class="number" id="todayOrders">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Items</h3>
            <div class="number" id="totalItems">0</div>
        </div>
    </div>

    <div class="filters">
        <div class="filter-row" style="margin-bottom: 15px;">
            <div class="filter-group">
                <label>Quick Filter</label>
                <select id="quickDateFilter" onchange="applyQuickDate()"
                    style="padding: 10px; border: 2px solid #ddd; border-radius: 8px; width: 100%;">
                    <option value="">All Period</option>
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                    <option value="week">Last 7 Days</option>
                    <option value="month">Last 30 Days</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Employee Name</label>
                <input type="text" id="filterEmployee" placeholder="Search Employee...">
            </div>
            <div class="filter-group">
                <label>Department</label>
                <input type="text" id="filterDepartment" placeholder="Search Department...">
            </div>
        </div>
        <div class="filter-row">
            <div class="filter-group">
                <label>From Date</label>
                <input type="date" id="filterFromDate">
            </div>
            <div class="filter-group">
                <label>To Date</label>
                <input type="date" id="filterToDate">
            </div>
        </div>
        <button class="btn btn-primary" onclick="applyFilters()" style="width: 100%; margin-top: 10px;">🔍 Apply
            Filters</button>
    </div>

    <div class="orders-container">
        <div class="orders-header">
            <h2>📋 Orders List</h2>
            <span id="ordersCount" style="color: #666;">Number of Orders: 0</span>
        </div>
        <table class="orders-table">
            <thead>
                <tr>
                    <th>Order Number</th>
                    <th>Employee Name</th>
                    <th>Department</th>
                    <th>Required Items</th>
                    <th>Date</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <tr>
                    <td colspan="6" class="no-orders">No orders found yet</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAhehi0m7CD8TU2PusKbXan7vfzuGYoSlE",
            authDomain: "buffet-82ec0.firebaseapp.com",
            databaseURL: "https://buffet-82ec0-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "buffet-82ec0",
            storageBucket: "buffet-82ec0.firebasestorage.app",
            messagingSenderId: "737817727386",
            appId: "1:737817727386:web:e3b13235cb6017ac47aa23",
            measurementId: "G-XL9C0ZQGRF"
        };

        // Initialize Firebase
        let db = null;
        let useFirebase = false;

        try {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                useFirebase = true;
                console.log('✅ Firebase initialized in admin panel');
            }
        } catch (error) {
            console.warn('⚠️ Firebase not available:', error);
            useFirebase = false;
        }

        let allOrders = [];
        let filteredOrders = [];

        // Notification Sound
        function playNotificationSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();

            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';

                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                }, i * 300);
            }
        }

        function showNotification(order) {
            playNotificationSound();

            if ('Notification' in window && Notification.permission === 'granted') {
                const itemsList = order.items.map(item => `${item.item} ×${item.quantity}`).join(', ');
                new Notification('🔔 New Order!', {
                    body: `${order.employeeName} - ${order.officeNumber}\n${itemsList}`,
                    icon: '🍽️',
                    requireInteraction: false
                });
            }
        }

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        // Setup Firebase listener
        function setupFirebaseListener() {
            if (useFirebase && db) {
                console.log('🔥 Setting up Firebase listener in admin panel...');

                db.ref('orders').on('child_added', (snapshot) => {
                    const order = snapshot.val();
                    const now = Date.now();
                    const orderTime = new Date(order.timestamp).getTime();

                    if (now - orderTime < 10000) {
                        console.log('🔔 New order for admin:', order);
                        showNotification(order);
                    }

                    loadOrders();
                });

                db.ref('orders').on('child_changed', () => loadOrders());
                db.ref('orders').on('child_removed', () => loadOrders());

                console.log('✅ Firebase listener active in admin panel');
            }
        }

        // Check admin authentication
        function checkAuth() {
            const employeeData = sessionStorage.getItem('current_employee');
            if (!employeeData) {
                window.location.href = 'index.html';
                return false;
            }
            const employee = JSON.parse(employeeData);
            if (!employee.isAdmin) {
                alert('⚠️ You are not authorized to access this page');
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        // Logout
        function logout() {
            if (confirm('⚠️ Do you want to logout?')) {
                sessionStorage.removeItem('current_employee');
                window.location.href = 'index.html';
            }
        }

        // Load orders
        async function loadOrders() {
            try {
                let orders = [];
                let history = [];

                // Try Firebase first
                if (useFirebase && db) {
                    try {
                        // Get current orders
                        const ordersSnapshot = await db.ref('orders').once('value');
                        const ordersData = ordersSnapshot.val();
                        if (ordersData) {
                            orders = Object.values(ordersData);
                            console.log('✅ Loaded', orders.length, 'orders from Firebase');
                        }

                        // Get history
                        const historySnapshot = await db.ref('history').once('value');
                        const historyData = historySnapshot.val();
                        if (historyData) {
                            history = Object.values(historyData);
                            console.log('✅ Loaded', history.length, 'history from Firebase');
                        }

                        // Sync to localStorage
                        localStorage.setItem('buffet_orders', JSON.stringify(orders));
                        localStorage.setItem('buffet_history', JSON.stringify(history));
                    } catch (error) {
                        console.error('❌ Firebase error:', error);
                    }
                }

                // Fallback to localStorage if Firebase failed or no data
                if (orders.length === 0) {
                    const ordersData = localStorage.getItem('buffet_orders');
                    orders = ordersData ? JSON.parse(ordersData) : [];
                    console.log('📦 Loaded', orders.length, 'orders from localStorage');
                }

                if (history.length === 0) {
                    const historyData = localStorage.getItem('buffet_history');
                    history = historyData ? JSON.parse(historyData) : [];
                    console.log('📦 Loaded', history.length, 'history from localStorage');
                }

                // Combine orders and history
                allOrders = [...orders, ...history].sort((a, b) => b.id - a.id);
                filteredOrders = [...allOrders];

                console.log('📊 Total orders displayed:', allOrders.length);

                displayOrders(filteredOrders);
                updateStats(filteredOrders);
            } catch (error) {
                console.error('❌ Error loading orders:', error);
                alert('error loading orders');
            }
        }

        // Display orders in table
        function displayOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            document.getElementById('ordersCount').textContent = `Number of orders: ${orders.length}`;

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-orders">No orders found</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(order => {
                const date = new Date(order.timestamp);
                const dateStr = date.toLocaleDateString('ar-EG');
                const timeStr = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                const itemsList = order.items.map(item => {
                    let html = `<div class="order-item">• ${item.item} (${item.quantity})`;
                    if (item.comment) {
                        html += `<br><span style="font-size: 11px; color: #666; font-style: italic; margin-right: 10px;">💬 ${item.comment}</span>`;
                    }
                    html += `</div>`;
                    return html;
                }).join('');

                return `
                    <tr>
                        <td><strong>#${order.id}</strong></td>
                        <td>${order.employeeName}</td>
                        <td>${order.officeNumber}</td>
                        <td><div class="order-items">${itemsList}</div></td>
                        <td>${dateStr}</td>
                        <td>${timeStr}</td>
                    </tr>
                `;
            }).join('');
        }

        // Update statistics
        function updateStats(orders) {
            // Total orders
            document.getElementById('totalOrders').textContent = orders.length;

            // Active employees (unique)
            const uniqueEmployees = new Set(orders.map(o => o.employeeName));
            document.getElementById('activeEmployees').textContent = uniqueEmployees.size;

            // Today's orders
            const today = new Date().toDateString();
            const todayOrders = orders.filter(o => new Date(o.timestamp).toDateString() === today);
            document.getElementById('todayOrders').textContent = todayOrders.length;

            // Total items
            const totalItems = orders.reduce((sum, order) => {
                return sum + order.items.reduce((itemSum, item) => itemSum + item.quantity, 0);
            }, 0);
            document.getElementById('totalItems').textContent = totalItems;
        }

        // Apply filters
        // Quick date filter
        function applyQuickDate() {
            const quickFilter = document.getElementById('quickDateFilter').value;
            const today = new Date();
            let fromDate = null;
            let toDate = today.toISOString().split('T')[0];

            switch (quickFilter) {
                case 'today':
                    fromDate = toDate;
                    break;
                case 'yesterday':
                    const yesterday = new Date(today);
                    yesterday.setDate(yesterday.getDate() - 1);
                    fromDate = yesterday.toISOString().split('T')[0];
                    toDate = fromDate;
                    break;
                case 'week':
                    const weekAgo = new Date(today);
                    weekAgo.setDate(weekAgo.getDate() - 7);
                    fromDate = weekAgo.toISOString().split('T')[0];
                    break;
                case 'month':
                    const monthAgo = new Date(today);
                    monthAgo.setDate(monthAgo.getDate() - 30);
                    fromDate = monthAgo.toISOString().split('T')[0];
                    break;
                default:
                    fromDate = '';
                    toDate = '';
            }

            document.getElementById('filterFromDate').value = fromDate || '';
            document.getElementById('filterToDate').value = toDate || '';
            applyFilters();
        }

        function applyFilters() {
            const employeeFilter = document.getElementById('filterEmployee').value.toLowerCase();
            const departmentFilter = document.getElementById('filterDepartment').value.toLowerCase();
            const fromDate = document.getElementById('filterFromDate').value;
            const toDate = document.getElementById('filterToDate').value;

            filteredOrders = allOrders.filter(order => {
                // Employee name filter
                if (employeeFilter && !order.employeeName.toLowerCase().includes(employeeFilter)) {
                    return false;
                }

                // Department filter
                if (departmentFilter && !order.officeNumber.toLowerCase().includes(departmentFilter)) {
                    return false;
                }

                // Date filters
                const orderDate = new Date(order.timestamp).toISOString().split('T')[0];
                if (fromDate && orderDate < fromDate) {
                    return false;
                }
                if (toDate && orderDate > toDate) {
                    return false;
                }

                return true;
            });

            displayOrders(filteredOrders);
            updateStats(filteredOrders);
        }

        // Export to Excel
        function exportToExcel() {
            if (filteredOrders.length === 0) {
                alert('⚠️ No data to export');
                return;
            }

            // Prepare data for export
            const exportData = filteredOrders.map(order => {
                const date = new Date(order.timestamp);
                const items = order.items.map(item => `${item.item} (${item.quantity})`).join(', ');

                return {
                    'Order Number': order.id,
                    'Employee Name': order.employeeName,
                    'Department': order.officeNumber,
                    'Items Required': items,
                    'Date': date.toLocaleDateString('ar-EG'),
                    'Time': date.toLocaleTimeString('ar-EG'),
                    'Total Items': order.items.reduce((sum, item) => sum + item.quantity, 0)
                };
            });

            // Create workbook
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(exportData);

            // Set column widths
            ws['!cols'] = [
                { wch: 12 },  // Order ID
                { wch: 20 },  // Employee name
                { wch: 20 },  // Department
                { wch: 50 },  // Items
                { wch: 15 },  // Date
                { wch: 12 },  // Time
                { wch: 12 }   // Total items
            ];

            XLSX.utils.book_append_sheet(wb, ws, 'Buffet Orders');

            // Generate filename with current date
            const filename = `buffet_orders_${new Date().toISOString().split('T')[0]}.xlsx`;

            // Save file
            XLSX.writeFile(wb, filename);
        }

        // Initialize on page load
        window.addEventListener('load', function () {
            if (checkAuth()) {
                requestNotificationPermission();
                setupFirebaseListener();
                loadOrders();
            }
        });

        // Auto refresh every 30 seconds
        setInterval(() => {
            loadOrders();
        }, 30000);
    </script>
</body>

</html>
